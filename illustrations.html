<script>

const projets = [
    {
    nom: "catalogue du web",
    url: "catalogueduweb.html",
    image: "images/catalogueduweb/01.webp"
  },
  {
    nom: "fulica mono",
    url: "fulicamono.html",
    image: "images/fulicamono/2.webp"
  },
  {
    nom: "l'art de regarder le monde",
    url: "artderegarderlemonde.html",
    image: "images/artderegarderlemonde/6.webp"
  },
  {
    nom: "archives Est",
    url: "archivesest.html",
    image: "images/archivesest/2.webp"
  },
  {
    nom: "encre seiche",
    url: "encreseiche.html",
    image: "images/encreseiche/6.webp"
  },
  {
    nom: "Projet 5",
    url: "projet-6.html",
    image: "images/projet-5.jpg"
  }
];

const grille = document.querySelector(".related-projects__grid");

const aleatoires = [...projets]
  .sort(() => Math.random() - 0.5)
  .slice(0, 4);

aleatoires.forEach(projet => {

  const carte = document.createElement("a");

  carte.className = "related-project";
  carte.href = projet.url;

  carte.innerHTML = `
    <div class="related-project__image">
      <img src="${projet.image}" alt="${projet.nom}">
    </div>
    <h3>${projet.nom}</h3>
  `;

  grille.appendChild(carte);
});

</script>

    setTimeout(() => {
